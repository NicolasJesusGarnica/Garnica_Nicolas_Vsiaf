version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vsiaf_postgres
    restart: always
    environment:
      POSTGRES_DB: vsiaf_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/migration_vsiaf.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  backend:
    build: .
    container_name: vsiaf_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vsiaf_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      PORT: 8081

volumes:
  pgdata:
